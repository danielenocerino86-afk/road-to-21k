<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f8"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Road to 21K</title>
<style>
:root{font-family:system-ui,-apple-system,Arial;color:#f2f6ff;background:#0b1423}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 16px 95px}h1{font-size:29px;margin:4px 0}h2{font-size:20px;margin:6px 0 16px}.muted,small{color:#a9b7c9}.card{background:#172439;border:1px solid #2c405a;border-radius:18px;padding:18px;margin:14px 0}.hero{background:linear-gradient(125deg,#174e60,#172439)}.pill{display:inline-block;background:#234f54;border-radius:40px;padding:5px 10px;color:#a9ffdd;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#101d30;border-top:1px solid #2c405a;display:flex;justify-content:center;gap:5px;padding:9px}nav button{flex:1;max-width:160px;padding:11px 2px;font-size:12px}button,.btn{border:0;border-radius:11px;background:#2b405d;color:white;padding:11px 15px;font-weight:650;cursor:pointer}button.primary{background:#44d4a1;color:#071d1c}button:disabled{opacity:.45}input,select{background:#0d192b;border:1px solid #40546d;border-radius:10px;padding:12px;color:white;width:100%;font-size:16px}label{display:block;margin:12px 0 5px;color:#c4d3e4;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#0f1b2e;padding:14px;border-radius:12px}.stat b{font-size:24px;display:block}.session{border-left:3px solid #44d4a1;padding:8px 12px;margin:10px 0;background:#101e31;border-radius:0 10px 10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 4px;border-bottom:1px solid #2c405a;text-align:left}canvas{width:100%;height:180px}p{line-height:1.55} .warn{border-left:3px solid #ffbd68;padding-left:12px;color:#ffd9a7}
</style><link rel="stylesheet" href="./design.css"></head><body><main><header><span class="pill">IL TUO PERCORSO · 26 SETTIMANE</span><h1>Road to <span class="brand-mark">21K</span></h1><div class="muted">Un passo alla volta, verso nuovi traguardi.</div></header><section id="view"></section></main>
<nav><button onclick="tab('home')"><span class='nav-icon'>⌂</span>Oggi</button><button onclick="tab('plan')"><span class='nav-icon'>▦</span>Piano</button><button onclick="tab('log')"><span class='nav-icon'>✎</span>Diario</button><button onclick="tab('stats')"><span class='nav-icon'>◫</span>Progressi</button><button onclick="tab('settings')"><span class='nav-icon'>⚙</span>Dati</button></nav>
<script>
const KEY='road21k-v1';const today=()=>new Date().toISOString().slice(0,10);
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){};db=db||{start:today(),logs:[],weights:[],mode:'both',runReady:false};
let current='home',timerId=null,seconds=0;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const weeks=()=>Math.min(26,Math.max(1,Math.floor((new Date()-new Date(db.start+'T12:00:00'))/604800000)+1));
function schedule(w){let base=w<=4?15+(w-1)*3:w<=12?26+Math.floor((w-5)/2)*3:w<=20?36+Math.floor((w-13)/2)*3:46+Math.floor((w-21)/2)*3;return [
{day:'Lunedì',type:'Camminata facile',min:base,desc:'Ritmo conversazionale, superficie regolare. Sul tapis roulant inizia senza pendenza.'},
{day:'Martedì',type:'Forza e mobilità',min:20,desc:'Esercizi leggeri controllati per gambe e tronco; interrompi in caso di dolore.'},
{day:'Mercoledì',type:'Camminata a intervalli',min:base,desc:'5 min facili, poi alterna 2 min più svelti e 3 min facili, infine defaticamento.'},
{day:'Giovedì',type:'Recupero',min:0,desc:'Riposo o mobilità dolce.'},
{day:'Venerdì',type:'Camminata facile',min:base,desc:'Ritmo comodo, nessuna corsa obbligatoria.'},
{day:'Sabato',type:'Uscita lunga facile',min:Math.min(80,base+10),desc:'Camminata lunga, riduci durata se affaticato. Aumenta solo se recuperi bene.'},
{day:'Domenica',type:'Recupero',min:0,desc:'Riposo e verifica del recupero.'}
]}
const view=()=>document.getElementById('view');
function tab(t){current=t;render();scrollTo(0,0)}
function render(){if(current==='home')home();if(current==='plan')plan();if(current==='log')log();if(current==='stats')stats();if(current==='settings')settings()}
function home(){let w=weeks(),day=(new Date().getDay()+6)%7,s=schedule(w)[day];view().innerHTML=`<div class="card hero"><div class="muted">SETTIMANA ${w} DI 26</div><h2>${esc(s.type)}</h2><p>${esc(s.desc)}</p><h1>${s.min? s.min+' min':'Recupero'}</h1><div class="row"><button class="primary" onclick="tab('log')">Registra allenamento</button><button onclick="tab('plan')">Vedi settimana</button></div></div><div class="card"><h2>Timer allenamento</h2><h1 id="clock">00:00</h1><button onclick="toggleTimer()" id="timerbtn">Avvia</button> <button onclick="resetTimer()">Azzera</button><p class="muted">Timer manuale. Mantieni uno sforzo che consenta di parlare.</p></div><div class="card"><h2>Prima di iniziare</h2><p class="warn">Se parti da una lunga sedentarietà o hai condizioni mediche, concorda l'attività con il medico. La corsa va introdotta solo dopo una valutazione di idoneità, senza dolore e con una buona base di cammino. Il traguardo 21 km è a lungo termine, non una promessa per la settimana 26.</p></div>`;updateClock()}
function plan(){let w=weeks();view().innerHTML=`<div class="card"><h2>Calendario 26 settimane</h2><label>Settimana</label><select id="week" onchange="showWeek(+this.value)">${Array.from({length:26},(_,i)=>`<option value="${i+1}" ${i+1===w?'selected':''}>Settimana ${i+1}</option>`).join('')}</select><div id="weeklist"></div></div><div class="card"><h2>Come progredire</h2><p>Le durate sono indicative, non prescrizioni. Ripeti una settimana o riduci il carico se compaiono affaticamento eccessivo, dolore o recupero insufficiente. Ogni quarta settimana puoi ridurre il volume del 20–30%.</p><p>Le prime 26 settimane costruiscono soprattutto resistenza nella camminata. Corsa/camminata solo dopo idoneità medica e adattamento adeguato.</p></div>`;showWeek(w)}
function showWeek(w){document.getElementById('weeklist').innerHTML=schedule(w).map(s=>`<div class="session"><b>${s.day}: ${s.type} · ${s.min?s.min+' min':'riposo'}</b><p class="muted">${esc(s.desc)}</p></div>`).join('')}
function log(){view().innerHTML=`<div class="card"><h2>Registra allenamento</h2><form onsubmit="addLog(event)"><label>Data</label><input name="date" type="date" value="${today()}" required><label>Tipo</label><select name="type"><option>Camminata outdoor</option><option>Tapis roulant</option><option>Forza e mobilità</option><option>Corsa/camminata (se autorizzata)</option><option>Altro</option></select><div class="grid"><div><label>Minuti</label><input name="min" type="number" min="1" max="600" required></div><div><label>Chilometri</label><input name="km" type="number" min="0" max="100" step=".01" value="0"></div><div><label>Battito medio (facolt.)</label><input name="hr" type="number" min="0" max="240"></div><div><label>Fatica (1–10)</label><input name="rpe" type="number" min="1" max="10" value="3"></div></div><label>Dolore / note</label><input name="note" maxlength="250" placeholder="Es. nessun dolore, gambe stanche"><p><button class="primary" type="submit">Salva allenamento</button></p></form></div><div class="card"><h2>Registra peso</h2><form onsubmit="addWeight(event)"><div class="grid"><div><label>Data</label><input name="date" type="date" value="${today()}" required></div><div><label>Peso (kg)</label><input name="kg" type="number" min="20" max="500" step=".1" required></div></div><p><button class="primary" type="submit">Salva peso</button></p></form></div><div class="card"><h2>Ultimi allenamenti</h2>${db.logs.slice().reverse().slice(0,12).map(l=>`<div class="session"><b>${esc(l.date)} · ${esc(l.type)}</b><p>${l.min} min · ${l.km} km · fatica ${l.rpe}/10</p><small>${esc(l.note)}</small></div>`).join('')||'<p class="muted">Nessun allenamento registrato.</p>'}</div>`}
function addLog(e){e.preventDefault();let f=new FormData(e.target);db.logs.push({date:f.get('date'),type:f.get('type'),min:+f.get('min'),km:+f.get('km'),hr:+f.get('hr')||null,rpe:+f.get('rpe'),note:f.get('note')});save();render();alert('Allenamento salvato sul dispositivo')}
function addWeight(e){e.preventDefault();let f=new FormData(e.target);db.weights.push({date:f.get('date'),kg:+f.get('kg')});save();render();alert('Peso salvato sul dispositivo')}
function stats(){let km=db.logs.reduce((a,l)=>a+(+l.km||0),0),mins=db.logs.reduce((a,l)=>a+(+l.min||0),0),sorted=db.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));view().innerHTML=`<div class="card"><h2>I tuoi progressi</h2><div class="grid"><div class="stat"><b>${db.logs.length}</b><small>Allenamenti</small></div><div class="stat"><b>${km.toFixed(1)}</b><small>Chilometri totali</small></div><div class="stat"><b>${(mins/60).toFixed(1)}</b><small>Ore attive</small></div><div class="stat"><b>${sorted.length?sorted.at(-1).kg+' kg':'—'}</b><small>Ultimo peso</small></div></div></div><div class="card"><h2>Andamento del peso</h2><canvas id="weightChart" width="600" height="200"></canvas><p class="muted">Il grafico compare dopo almeno due registrazioni.</p></div>`;draw(sorted)}
function draw(d){if(d.length<2)return;let c=document.getElementById('weightChart'),x=c.getContext('2d'),a=d.map(p=>p.kg),lo=Math.min(...a)-1,hi=Math.max(...a)+1;x.clearRect(0,0,600,200);x.strokeStyle='#44d4a1';x.lineWidth=4;x.beginPath();a.forEach((v,i)=>{let px=20+i*560/(a.length-1),py=180-(v-lo)/(hi-lo)*160;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#b9c7d9';x.font='16px system-ui';x.fillText(hi.toFixed(1)+' kg',10,20);x.fillText(lo.toFixed(1)+' kg',10,195)}
function settings(){view().innerHTML=`<div class="card"><h2>Impostazioni</h2><label>Data di inizio programma</label><input type="date" value="${db.start}" onchange="db.start=this.value;save();render()"><p class="muted">I dati restano nel browser di questo dispositivo. Cancella i dati del browser = possibile perdita del diario. Esegui backup periodici.</p></div><div class="card"><h2>Backup e importazione</h2><p><button onclick="backup()">Esporta backup JSON</button></p><label>Ripristina backup JSON</label><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"><label>Importa allenamenti CSV</label><input type="file" accept=".csv,text/csv" onchange="importCSV(this.files[0])"><p class="muted">CSV richiesto: date,type,min,km,hr,rpe,note. Le colonne devono essere separate da virgole; date nel formato YYYY-MM-DD. Non è un collegamento automatico a Huawei Health: i file Huawei potrebbero richiedere conversione.</p></div><div class="card"><h2>Privacy</h2><p>Nessun account o server per il diario. Il repository GitHub contiene solo il codice pubblico. Non caricare dati personali sul repository.</p></div>`}
function download(name,data,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function backup(){download('road-to-21k-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.logs)||!Array.isArray(x.weights)||!/^\d{4}-\d\d-\d\d$/.test(x.start))throw Error('Formato non valido');if(confirm('Sostituire tutti i dati locali con il backup?')){db=x;save();render()}}catch(e){alert('Backup non valido: '+e.message)}}
async function importCSV(file){if(!file)return;try{let lines=(await file.text()).trim().split(/\r?\n/),h=lines.shift().split(',').map(x=>x.trim().toLowerCase());if(!['date','type','min','km'].every(k=>h.includes(k)))throw Error('Colonne obbligatorie: date,type,min,km');let n=0;for(let line of lines){let v=line.split(','),get=k=>v[h.indexOf(k)]||'';if(!/^\d{4}-\d\d-\d\d$/.test(get('date')))continue;db.logs.push({date:get('date'),type:get('type'),min:+get('min')||0,km:+get('km')||0,hr:+get('hr')||null,rpe:+get('rpe')||3,note:get('note')});n++}save();alert(n+' allenamenti importati');render()}catch(e){alert('Importazione fallita: '+e.message)}}
function updateClock(){let e=document.getElementById('clock');if(e)e.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function toggleTimer(){if(timerId){clearInterval(timerId);timerId=null}else{timerId=setInterval(()=>{seconds++;updateClock()},1000)}let b=document.getElementById('timerbtn');if(b)b.textContent=timerId?'Pausa':'Avvia'}
function resetTimer(){if(timerId)clearInterval(timerId);timerId=null;seconds=0;updateClock();let b=document.getElementById('timerbtn');if(b)b.textContent='Avvia'}

/* v1.1: piano guidato, esercizi e progressione prudente */
const exerciseLibrary=[
{name:'Sedersi e rialzarsi',reps:'2 serie × 6–10 ripetizioni',how:'Siediti su una sedia stabile con i piedi alla larghezza delle anche. Inclina leggermente il busto in avanti, spingi sui piedi e alzati. Scendi lentamente fino a sederti. Usa le mani come aiuto se necessario.',avoid:'Non lasciarti cadere sulla sedia. Se senti dolore alle ginocchia, riduci il movimento.'},
{name:'Spinte al muro',reps:'2 serie × 8–12 ripetizioni',how:'Appoggia i palmi al muro all’altezza del petto. Fai un passo indietro, mantieni il corpo allineato. Piega i gomiti avvicinando il petto al muro, poi spingi per tornare.',avoid:'Non inarcare la schiena. Avvicina i piedi al muro per rendere l’esercizio più facile.'},
{name:'Sollevamenti sui polpacci',reps:'2 serie × 10–12 ripetizioni',how:'In piedi dietro una sedia stabile, tieniti allo schienale. Solleva lentamente i talloni, resta un secondo sulle punte, poi riabbassali con controllo.',avoid:'Evita di rimbalzare o perdere l’equilibrio.'},
{name:'Marcia sul posto',reps:'2 serie × 45 secondi',how:'In piedi vicino a un appoggio, solleva un ginocchio alla volta a un’altezza comoda. Mantieni il busto alto e respira normalmente.',avoid:'Non forzare l’altezza delle ginocchia.'},
{name:'Bird dog semplificato',reps:'2 serie × 6 per lato',how:'In quadrupedia su un tappetino, mani sotto le spalle e ginocchia sotto le anche. Allunga lentamente un braccio in avanti, torna e cambia lato. Se stabile, aggiungi la gamba opposta.',avoid:'Non ruotare il bacino o inarcare la schiena.'},
{name:'Mobilità caviglie e anche',reps:'4–5 minuti',how:'Da seduto esegui cerchi lenti con le caviglie, poi apri e chiudi dolcemente le ginocchia. Muoviti senza rimbalzi e senza dolore.',avoid:'Non forzare l’ampiezza del movimento.'}
];
function detailedSchedule(w){
 const deload=w%4===0,phase=w<=4?0:w<=12?1:w<=20?2:3;
 const mins=[15,22,32,42][phase]+Math.floor((w-1)%8/2)*3;
 const easy=Math.round(mins*(deload?.8:1)),long=Math.min(75,Math.round((mins+12)*(deload?.8:1)));
 const runOK=db.runReady===true&&w>=13;
 return [
 {day:'Lunedì',type:'Camminata facile',min:easy,desc:'Ritmo conversazionale, senza affanno.',steps:[{name:'Riscaldamento',min:5,detail:'Cammina molto lentamente.'},{name:'Camminata facile',min:Math.max(5,easy-10),detail:'Passo naturale: devi riuscire a parlare in frasi complete.'},{name:'Defaticamento',min:5,detail:'Rallenta progressivamente.'}]},
 {day:'Martedì',type:'Forza e mobilità',min:25,desc:'Circuito semplice, senza salti.',strength:true,steps:[{name:'Attivazione',min:5,detail:'Marcia sul posto e mobilità dolce.'},{name:'Circuito di forza',min:15,detail:'Esegui gli esercizi spiegati qui sotto, con 45–90 secondi di recupero tra le serie.'},{name:'Mobilità',min:5,detail:'Respira e muovi lentamente le articolazioni.'}]},
 {day:'Mercoledì',type:runOK?'Corsa/camminata introduttiva':'Camminata a intervalli',min:easy,desc:runOK?'Solo con idoneità medica e dopo 30 minuti di cammino comodo senza dolore.':'Alterna passo svelto e passo facile; non serve correre.',steps:runOK?[{name:'Camminata di riscaldamento',min:8,detail:'Ritmo molto facile.'},...Array.from({length:4},()=>[{name:'Jogging molto lento',min:1,detail:'Passi corti, atterraggio morbido, sforzo 3–4/10.'},{name:'Camminata di recupero',min:3,detail:'Recupera completamente il respiro.'}]).flat(),{name:'Defaticamento',min:6,detail:'Cammina lentamente.'}]:[{name:'Riscaldamento',min:5,detail:'Cammina piano.'},...Array.from({length:Math.max(1,Math.floor((easy-10)/5))},()=>[{name:'Passo svelto',min:2,detail:'Un po’ più veloce, ma senza ansimare.'},{name:'Passo facile',min:3,detail:'Ritorna a ritmo tranquillo.'}]).flat(),{name:'Defaticamento',min:5,detail:'Cammina lentamente.'}]},
 {day:'Giovedì',type:'Recupero',min:0,desc:'Riposo; se ti senti bene, mobilità molto leggera.',steps:[]},
 {day:'Venerdì',type:'Camminata facile',min:easy,desc:'Concentrati sulla regolarità del passo.',steps:[{name:'Riscaldamento',min:5,detail:'Passo lento.'},{name:'Passo facile',min:Math.max(5,easy-10),detail:'Mantieni una respirazione tranquilla.'},{name:'Defaticamento',min:5,detail:'Rallenta.'}]},
 {day:'Sabato',type:'Uscita lunga facile',min:long,desc:'Cammina a ritmo comodo; puoi dividere la sessione in due parti.',steps:[{name:'Partenza facile',min:5,detail:'Inizia molto lentamente.'},{name:'Camminata lunga',min:Math.max(5,long-10),detail:'Ritmo conversazionale; porta acqua se serve.'},{name:'Defaticamento',min:5,detail:'Rallenta progressivamente.'}]},
 {day:'Domenica',type:'Recupero',min:0,desc:'Riposo, idratazione e verifica dei sintomi.',steps:[]}
 ]}
schedule=detailedSchedule;
let selectedGuide=0,guideWeek=1,guideIndex=0,guideSeconds=0,guideRunning=false,guideTimer=null;
const baseRender=render;render=function(){if(current==='guide')guided();else baseRender()};
function openGuide(w,i){guideWeek=w;selectedGuide=i;guideIndex=0;guideSeconds=0;if(guideTimer)clearInterval(guideTimer);guideTimer=null;current='guide';render();scrollTo(0,0)}
function guided(){let s=schedule(guideWeek)[selectedGuide],step=s.steps[guideIndex];view().innerHTML='<div class="card"><button onclick="tab(\'plan\')">← Torna al piano</button><p class="muted">SETTIMANA '+guideWeek+' · '+s.day+'</p><h2>'+esc(s.type)+'</h2><p>'+esc(s.desc)+'</p><p><b>Durata indicativa: '+s.min+' minuti</b></p>'+(s.steps.length?'<div class="session"><small>FASE '+(guideIndex+1)+' DI '+s.steps.length+'</small><h2>'+esc(step.name)+'</h2><p>'+esc(step.detail)+'</p><h1 id="guideClock">'+formatClock(guideSeconds)+' / '+formatClock(step.min*60)+'</h1><button class="primary" onclick="guideToggle()">'+(guideTimer?'Pausa':'Avvia timer')+'</button> <button onclick="guideNext()">Fase successiva →</button></div>':'<p>Giornata di recupero. Nessun timer necessario.</p>')+'</div>'+(s.strength?'<div class="card"><h2>Esercizi spiegati passo passo</h2>'+exerciseLibrary.map((x,i)=>'<div class="session"><b>'+(i+1)+'. '+esc(x.name)+'</b><p><strong>'+esc(x.reps)+'</strong></p><p>'+esc(x.how)+'</p><small>Attenzione: '+esc(x.avoid)+'</small></div>').join('')+'</div>':'')+'<div class="card"><h2>Come eseguire bene la seduta</h2><p><b>Tapis roulant:</b> usa la clip di sicurezza, inizia a velocità comoda e pendenza 0%; aumenta solo se il passo resta controllato. Non aggrapparti ai corrimano durante la marcia, salvo necessità di equilibrio.</p><p><b>All’aperto:</b> scegli un percorso piano e sicuro, scarpe comode e un passo regolare. Non inseguire velocità o chilometri.</p><p><b>Intensità:</b> mira a fatica 2–4/10; dovresti poter parlare. Interrompi per dolore toracico, capogiri, affanno anomalo o dolore che altera il passo.</p><button class="primary" onclick="tab(\'log\')">Registra questa seduta</button></div>'}
function formatClock(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function guideToggle(){if(guideTimer){clearInterval(guideTimer);guideTimer=null;guided();return}let s=schedule(guideWeek)[selectedGuide],step=s.steps[guideIndex];if(!step)return;guideTimer=setInterval(()=>{guideSeconds++;let c=document.getElementById('guideClock');if(c)c.textContent=formatClock(guideSeconds)+' / '+formatClock(step.min*60);if(guideSeconds>=step.min*60){clearInterval(guideTimer);guideTimer=null;if(navigator.vibrate)navigator.vibrate([150,100,150]);guideNext()}},1000);guided()}
function guideNext(){if(guideTimer){clearInterval(guideTimer);guideTimer=null}let s=schedule(guideWeek)[selectedGuide];guideIndex=Math.min(guideIndex+1,s.steps.length-1);guideSeconds=0;guided()}
home=function(){let w=weeks(),day=(new Date().getDay()+6)%7,s=schedule(w)[day];view().innerHTML='<div class="card hero"><span class="pill">SETTIMANA '+w+' / 26</span><h2>'+esc(s.type)+'</h2><p>'+esc(s.desc)+'</p><h1>'+(s.min?s.min+' min':'Recupero')+'</h1><button class="primary" onclick="openGuide('+w+','+day+')">Apri allenamento guidato →</button> <button onclick="tab(\'plan\')">Piano completo</button></div><div class="card"><h2>Progressione intelligente</h2><p>Ogni quarta settimana è più leggera. Ripeti la settimana se il recupero non è buono. La corsa non si sblocca automaticamente: serve una valutazione medica e una base di cammino solida.</p><p class="warn">Il traguardo 21 km è a lungo termine, non garantito entro 26 settimane.</p></div>'};

function recommendation(){
let last=db.reviews.slice(-3);if(!last.length)return {title:'Inizia con calma',message:'Registra almeno un check-in dopo gli allenamenti. La progressione resta prudente.'};

function csvRows(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(field);field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=ch}row.push(field);if(row.some(v=>v.trim()))rows.push(row);return rows}
async function importFlexibleCSV(file){if(!file)return;try{let rows=csvRows(await file.text());if(rows.length<2)throw Error('File senza righe dati');let header=rows.shift().map(s=>s.trim().toLowerCase().replace(/\s+/g,'_'));let col=(row,names)=>{let i=names.map(n=>header.indexOf(n)).find(i=>i>=0);return i===undefined?'':String(row[i]||'').trim()};let count=0,skipped=0;for(let row of rows){let date=col(row,['date','start_time','date_time','workout_date']).slice(0,10),duration=col(row,['min','duration_minutes','duration_min']),km=col(row,['km','distance_km']),hr=col(row,['hr','avg_hr','average_heart_rate']);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!duration){skipped++;continue}let entry={date,type:col(row,['type','sport_type','activity_type'])||'Importazione CSV',min:+duration||0,km:+km||0,hr:+hr||null,rpe:3,note:'Importazione CSV (verificare unità e valori)'};if(entry.min<=0||entry.min>1440||entry.km<0||entry.km>200){skipped++;continue}if(db.logs.some(x=>x.date===entry.date&&x.type===entry.type&&+x.min===entry.min&&+x.km===entry.km)){skipped++;continue}db.logs.push(entry);count++}save();alert('Importati: '+count+'. Ignorati/duplicati: '+skipped+'. Verifica che durata e distanza siano corrette.');render()}catch(e){alert('Impossibile importare: '+e.message)}}
